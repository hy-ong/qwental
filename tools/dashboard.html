<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwental</title>
<style>
:root {
  --bg: #0f1115; --panel: #161a20; --panel2: #1e232b; --line: #262c35;
  --fg: #e7eaee; --dim: #8a929c; --faint: #5b636d;
  --accent: #5aa2ff; --ok: #3fb950; --warn: #d6a12a; --bad: #f0605a;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f7f8fa; --panel: #ffffff; --panel2: #eef1f4; --line: #e1e5ea;
    --fg: #1d2127; --dim: #5f6873; --faint: #9aa2ac;
    --accent: #0a6bd6; --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 18px 32px 40px; min-width: 360px; }
header { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 28px; font-size: 13px; color: var(--dim); }
header h1 { font-size: 16px; margin: 0; font-weight: 650; color: var(--fg); }
.conn { display: flex; align-items: center; gap: 7px; color: var(--fg); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.conn.ok .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
.conn.bad { color: var(--bad); }
.conn.bad .dot { background: var(--bad); }
.lang { margin-left: auto; display: flex; border-radius: 999px; background: var(--panel); padding: 2px; }
.lang button, .seg button { font: inherit; font-size: 12px; color: var(--dim); background: none; border: 0; padding: 3px 11px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.lang button.on, .seg button.on { color: var(--fg); background: var(--panel2); font-weight: 600; }
.banner { display: none; margin: -12px 0 24px; padding: 10px 14px; border-radius: 10px; background: color-mix(in srgb, var(--bad) 12%, var(--panel)); font-size: 13px; }
.banner.show { display: block; }
.banner b { color: var(--bad); font-weight: 600; }
.stale { opacity: .45; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; margin-bottom: 28px; }
.stat .lbl { color: var(--dim); font-size: 13px; }
.stat .big { font-size: 38px; font-weight: 500; line-height: 1.15; margin: 4px 0 4px; letter-spacing: -.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .big small { font-size: 14px; color: var(--dim); font-weight: 400; letter-spacing: 0; margin: 0 2px 0 4px; }
.stat .big .sep { color: var(--faint); font-weight: 300; margin: 0 6px; }
.stat .sub { color: var(--dim); font-size: 13px; min-height: 1.45em; }
.big.is-ok { color: var(--ok); } .big.is-warn, .sub.is-warn { color: var(--warn); } .big.is-bad { color: var(--bad); }
.big.zero { color: var(--faint); }
.row { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 24px; margin-bottom: 20px; }
.panel { background: var(--panel); border-radius: 12px; padding: 14px 18px; min-width: 0; }
.panel h2 { font-size: 13px; margin: 0 0 10px; font-weight: 500; color: var(--dim); display: flex; align-items: baseline; gap: 10px; }
.panel h2 .r { margin-left: auto; font-size: 12px; color: var(--faint); }
.cbox { position: relative; height: 240px; }
.cbox canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cv { display: grid; grid-template-columns: 6.5em minmax(0, 1fr) 4.5em; align-items: center; gap: 12px; padding: 6px 0; font-size: 13px; }
.cv + .cv { border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.cv .mid { display: flex; align-items: center; gap: 10px; color: var(--dim); min-width: 0; white-space: nowrap; }
.cv .pc { width: 3.6em; text-align: right; }
.cv .plen { text-align: right; color: var(--dim); }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 999px; justify-self: start; white-space: nowrap; }
.c-gen { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.c-read { color: var(--fg); background: var(--panel2); }
.c-wait { color: var(--dim); background: none; box-shadow: inset 0 0 0 1px var(--line); }
.bar { flex: 1; height: 4px; background: var(--panel2); border-radius: 2px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .4s; }
.empty { color: var(--dim); text-align: center; padding: 22px 8px; font-size: 13px; }
.costline { color: var(--dim); font-size: 13px; margin: 4px 0 28px; }
.costline b { color: var(--fg); font-weight: 500; }
details > summary { list-style: none; cursor: pointer; color: var(--dim); font-size: 13px; padding: 10px 0; border-top: 1px solid var(--line); user-select: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸"; display: inline-block; width: 1.2em; }
details[open] > summary::before { content: "▾"; }
details > summary:hover { color: var(--fg); }
.dbody { padding-top: 10px; }
.dbody .row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.dbody .panel { margin-bottom: 20px; }
.dbody .row .panel { margin-bottom: 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: right; color: var(--dim); font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { text-align: right; padding: 5px 8px; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 13px; margin: 0; }
.kv dt { color: var(--dim); }
.kv dd { margin: 0; text-align: right; }
.rates .r { display: grid; grid-template-columns: max-content 1fr 4.5em; align-items: center; gap: 10px; font-size: 12.5px; margin: 5px 0; }
.rates .r .v { text-align: right; }
.rates .r .k { color: var(--dim); white-space: nowrap; min-width: 6.5em; }
.rates .r.cur .k { color: var(--fg); font-weight: 600; }
.seg { display: inline-flex; margin-left: auto; border-radius: 999px; background: var(--panel2); padding: 2px; font-weight: 400; }
.seg[hidden] { display: none; }
.seg button.on { background: var(--panel); }
#hist .cbox { height: 150px; margin-bottom: 8px; }
#hist tr.cur td { font-weight: 650; }
.costg { display: grid; grid-template-columns: 1fr 1fr minmax(240px, .85fr); gap: 0; }
.costg > div { padding: 2px 18px; min-width: 0; }
.costg > div:first-child { padding-left: 0; }
.costg > div + div { border-left: 1px solid var(--line); }
.cs .lbl, .cp .lbl { color: var(--dim); font-size: 12.5px; }
.cs .big { font-size: 26px; font-weight: 500; line-height: 1.2; margin: 2px 0 6px; white-space: nowrap; }
.ck { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 12px; font-size: 13px; margin: 0; }
.ck dt { color: var(--dim); }
.ck dd { margin: 0; text-align: right; }
.ck dd.t { color: var(--faint); }
.cs .sub { color: var(--dim); font-size: 12px; margin-top: 6px; }
.cs .empty { text-align: left; padding: 8px 0; font-size: 12.5px; }
.cp label { display: grid; grid-template-columns: 1fr 7.5em; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); margin: 5px 0; }
.cp input { font: 13px var(--sans); font-variant-numeric: tabular-nums; color: var(--fg); background: var(--panel2); border: 1px solid transparent; border-radius: 6px; padding: 3px 6px; text-align: right; width: 100%; }
.cp input:focus { outline: none; border-color: var(--accent); }
.cp-foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--dim); }
.cp-foot button { margin-left: auto; font: inherit; color: var(--accent); background: none; border: 0; padding: 2px 0; cursor: pointer; white-space: nowrap; }
.cp-foot button:disabled { color: var(--faint); cursor: default; }
footer { color: var(--faint); font-size: 12px; margin-top: 8px; display: flex; gap: 16px; flex-wrap: wrap; }
@media (max-width: 1100px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row, .dbody .row { grid-template-columns: 1fr; }
  .costg { grid-template-columns: 1fr; }
  .costg > div { padding: 10px 0; }
  .costg > div + div { border-left: 0; border-top: 1px solid var(--line); }
}
@media (max-width: 560px) { .stats { grid-template-columns: 1fr; } .wrap { padding: 14px 16px 32px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Qwental</h1>
    <div class="conn" id="conn"><span class="dot"></span><span id="conn-txt"></span></div>
    <span id="h-ver">—</span>
    <span id="h-up">—</span>
    <div class="lang" id="lang" role="group"></div>
  </header>

  <div class="banner" id="banner"></div>

  <div id="main">
  <section class="stats">
    <div class="stat" data-i18n-title="tpsT">
      <div class="lbl" data-i18n="tps"></div>
      <div class="big" id="k-tps">—</div>
      <div class="sub" id="k-tps-sub"></div>
    </div>
    <div class="stat" data-i18n-title="convT">
      <div class="lbl" data-i18n="conv"></div>
      <div class="big" id="k-conv">—</div>
      <div class="sub" id="k-conv-sub"></div>
    </div>
    <div class="stat" data-i18n-title="pfT">
      <div class="lbl" data-i18n="pf"></div>
      <div class="big" id="k-pf">—</div>
      <div class="sub" id="k-pf-sub"></div>
    </div>
    <div class="stat" id="c-mem">
      <div class="lbl" data-i18n="mem"></div>
      <div class="big" id="k-mem">—</div>
      <div class="sub" id="k-mem-sub"></div>
    </div>
  </section>

  <section class="row">
    <div class="panel">
      <h2><span data-i18n="chart"></span></h2>
      <div class="cbox"><canvas id="chart"></canvas></div>
    </div>
    <div class="panel">
      <h2><span data-i18n="tbl"></span><span class="r" data-i18n="thPrompt"></span></h2>
      <div id="list"><div class="empty" data-i18n="waiting"></div></div>
    </div>
  </section>

  <div class="costline" id="costline"></div>

  <details id="det">
    <summary data-i18n="details"></summary>
    <div class="dbody">
      <section class="row" style="margin-bottom:20px">
        <div class="panel">
          <h2><span data-i18n="totals"></span> <span id="totals-note" style="color:var(--faint);font-size:12px"></span>
            <span class="seg" id="scope" role="group" hidden><button type="button" data-s="s" data-i18n="scopeS"></button><button type="button" data-s="l" data-i18n="scopeL" data-i18n-title="scopeLT"></button></span></h2>
          <dl class="kv">
            <dt data-i18n-title="tTotalT"><span data-i18n="tTotal"></span></dt><dd id="t-total">—</dd>
            <dt data-i18n-title="tGpuT"><span data-i18n="tGpu"></span></dt><dd id="t-gpu">—</dd>
            <dt data-i18n="tDone"></dt><dd id="t-done">—</dd>
            <dt data-i18n="tIn"></dt><dd id="t-in">—</dd>
            <dt data-i18n="tCached" data-i18n-title="tCachedT"></dt><dd id="t-cached">—</dd>
            <dt data-i18n="tPf" data-i18n-title="tPfT"></dt><dd id="t-pf">—</dd>
            <dt data-i18n="tOut"></dt><dd id="t-out">—</dd>
            <dt data-i18n="tAvg"></dt><dd id="t-avg">—</dd>
            <dt data-i18n="tCancel"></dt><dd id="t-cancel">—</dd>
          </dl>
        </div>
        <div class="panel rates">
          <h2><span data-i18n="rates" data-i18n-title="ratesT"></span> <span class="r" id="mode-note"></span></h2>
          <div id="rates-list"><div class="empty" data-i18n="noRates"></div></div>
        </div>
      </section>

      <section class="panel" id="cost">
        <h2><span data-i18n="cost" data-i18n-title="costT"></span> <span class="r" data-i18n="costNote"></span></h2>
        <div class="costg">
          <div class="cs" id="cs-s"></div>
          <div class="cs" id="cs-l"></div>
          <div class="cp">
            <div class="lbl" data-i18n="prices"></div>
            <label><span data-i18n="pIn" data-i18n-title="pInT"></span><input id="p-in" type="number" min="0" step="any" inputmode="decimal"></label>
            <label><span data-i18n="pCache"></span><input id="p-cache" type="number" min="0" step="any" inputmode="decimal"></label>
            <label><span data-i18n="pOut"></span><input id="p-out" type="number" min="0" step="any" inputmode="decimal"></label>
            <div class="cp-foot"><span id="p-src"></span><button type="button" id="p-reset" data-i18n="pReset"></button></div>
          </div>
        </div>
      </section>

      <section class="panel" id="hist" hidden>
        <h2><span data-i18n="hist"></span> <span data-i18n="histNote" style="color:var(--faint);font-size:12px"></span>
          <span class="seg" id="per" role="group"><button type="button" data-p="d" data-i18n="pD"></button><button type="button" data-p="w" data-i18n="pW"></button><button type="button" data-p="m" data-i18n="pM"></button></span></h2>
        <div class="cbox"><canvas id="hchart"></canvas></div>
        <table>
          <thead><tr><th data-i18n="hPer"></th><th data-i18n="tDone"></th><th data-i18n="tIn"></th><th data-i18n="tCached"></th><th data-i18n="tOut"></th><th data-i18n="cost"></th></tr></thead>
          <tbody id="hbody"></tbody>
        </table>
      </section>

      <footer>
        <span id="f-prof"></span>
        <span><span data-i18n="srcA"></span>GET /status<span data-i18n="srcB"></span></span>
        <span id="f-last">—</span>
      </footer>
    </div>
  </details>
  </div>
</div>

<script>

  const $ = (id) => document.getElementById(id);
  const POLL_MS = 1000, HIST_S = 300, TPS_WIN = 5;
  const num = (v) => (typeof v === "number" && isFinite(v) ? v : null);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  // ---- usage by period (from lifetime.days, summed in the page) ----
  let DAYS = {}, daysAt = 0, hrows = [];
  let per = /^[dwm]$/.test(load("qw-per") || "") ? load("qw-per") : "d";
  const p2 = (n) => String(n).padStart(2, "0");
  const dkey = (x) => `${x.getFullYear()}-${p2(x.getMonth() + 1)}-${p2(x.getDate())}`;
  function periods() {
    const n = new Date(), y = n.getFullYear(), m = n.getMonth(), dd = n.getDate(), out = [];
    const df = (o) => new Intl.DateTimeFormat(L, o);
    if (per === "d") {
      const f = df({ weekday: "short", month: "short", day: "numeric" }), fs = df({ month: "numeric", day: "numeric" });
      for (let i = 13; i >= 0; i--) { const a = new Date(y, m, dd - i); out.push([a, new Date(y, m, dd - i + 1), f.format(a), fs.format(a)]); }
    } else if (per === "w") {
      const mon = dd - ((n.getDay() + 6) % 7), f = df({ month: "short", day: "numeric" }), fs = df({ month: "numeric", day: "numeric" });
      for (let i = 11; i >= 0; i--) { const a = new Date(y, m, mon - 7 * i); out.push([a, new Date(y, m, mon - 7 * i + 7), tr("wkOf", { d: f.format(a) }), fs.format(a)]); }
    } else {
      const f = df({ year: "numeric", month: "long" }), fs = df({ month: "short" });
      for (let i = 11; i >= 0; i--) { const a = new Date(y, m - i, 1); out.push([a, new Date(y, m - i + 1, 1), f.format(a), fs.format(a)]); }
    }
    return out.map(([a, b, label, short]) => {
      const ka = dkey(a), kb = dkey(b), r = { label, short, done: 0, prompt_tokens: 0, cached_tokens: 0, output_tokens: 0 };
      for (const [k, v] of Object.entries(DAYS)) if (k >= ka && k < kb && v) for (const f of ["done", "prompt_tokens", "cached_tokens", "output_tokens"]) r[f] += num(v[f]) ?? 0;
      r.cost = costOf(r).total;
      return r;
    });
  }
  function paintHist() {
    const on = !!view?.d?.lifetime;
    $("hist").hidden = !on;
    if (!on || !$("det").open) return;
    for (const b of $("per").children) { const o = b.dataset.p === per; b.classList.toggle("on", o); b.setAttribute("aria-pressed", o); }
    hrows = periods();
    const cur = hrows.length - 1;
    $("hbody").innerHTML = hrows.map((r, i) => i).reverse().map((i) => {
      const r = hrows[i];
      return `<tr${i === cur ? ' class="cur"' : ""}><td>${esc(r.label)}${i === cur ? ` <span class="chip c-gen">${esc(S.cur[per])}</span>` : ""}</td>` +
        `<td>${human(r.done)}</td><td>${human(r.prompt_tokens)}</td><td>${human(r.cached_tokens)}</td><td>${human(r.output_tokens)}</td><td>${money(r.cost)}</td></tr>`;
    }).join("");
    drawHist();
  }
  function canvas(cv) {
    const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
    const g = cv.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    return [g, W, H];
  }
  function drawHist() {
    const cv = $("hchart");
    if ($("hist").hidden || !cv.clientWidth) return;
    const [g, W, H] = canvas(cv);
    const padL = 64, padR = 8, padT = 6, padB = 18, pw = W - padL - padR, ph = H - padT - padB, n = hrows.length;
    const mx = niceMax(Math.max(0.01, ...hrows.map((r) => r.cost)));
    g.font = `11px ${cssVar("--sans")}`; g.fillStyle = cssVar("--faint"); g.strokeStyle = cssVar("--line"); g.lineWidth = 1;
    for (let k = 0; k <= 2; k++) {
      const y = padT + ph * (1 - k / 2);
      g.beginPath(); g.moveTo(padL, y + .5); g.lineTo(padL + pw, y + .5); g.stroke();
      const v = (mx * k) / 2; g.textAlign = "right"; g.fillText(v >= 1 || !v ? USD[0].format(v) : money(v), padL - 8, y + 4);
    }
    const bw = pw / n, acc = cssVar("--accent");
    g.textAlign = "center";
    hrows.forEach((r, i) => {
      const h = (r.cost / mx) * ph, x0 = padL + i * bw + bw * 0.2;
      g.fillStyle = acc; g.globalAlpha = i === n - 1 ? 1 : 0.4;
      g.fillRect(x0, padT + ph - h, bw * 0.6, h);
      g.globalAlpha = 1; g.fillStyle = cssVar(i === n - 1 ? "--fg" : "--faint");
      g.fillText(r.short, padL + (i + 0.5) * bw, H - 4);
    });
  }
  $("per").addEventListener("click", (e) => {
    const k = e.target.closest("button")?.dataset.p;
    if (!k || k === per) return;
    per = k; store("qw-per", k);
    paintHist();
  });

  // ---- chart: output tok/s, last 5 minutes ----
  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function drawChart() {
    const [g, W, H] = canvas($("chart"));
    const padL = 44, padR = 8, padT = 8, padB = 20, pw = W - padL - padR, ph = H - padT - padB;
    const now = samples.length ? samples[samples.length - 1].t : Date.now();
    const x = (t) => padL + pw * (1 - (now - t) / (HIST_S * 1000));
    const tmax = niceMax(Math.max(10, ...samples.map((s) => s.tps).filter((v) => v !== null)));
    g.font = `11px ${cssVar("--sans")}`; g.fillStyle = cssVar("--faint"); g.strokeStyle = cssVar("--line"); g.lineWidth = 1;
    for (let k = 0; k <= 4; k++) {
      const y = Math.round(padT + ph * (1 - k / 4)) + .5;
      g.setLineDash(k ? [2, 4] : []);
      g.beginPath(); g.moveTo(padL, y); g.lineTo(padL + pw, y); g.stroke();
      g.textAlign = "right"; g.fillText(NF2.format(+((tmax * k) / 4).toPrecision(3)), padL - 8, y + 4);
    }
    g.setLineDash([]);
    g.textAlign = "center";
    for (const m of [5, 4, 3, 2, 1, 0]) {
      g.textAlign = m === 0 ? "right" : "center";
      g.fillText(m ? tr("axMin", { m }) : tr("axNow"), padL + pw * (1 - m / 5), H - 4);
    }
    // null samples (while disconnected) split the line into segments
    const segs = [[]], color = cssVar("--accent");
    for (const s of samples) {
      if (s.tps === null) { if (segs[segs.length - 1].length) segs.push([]); continue; }
      segs[segs.length - 1].push([x(s.t), padT + ph * (1 - Math.min(1, s.tps / tmax))]);
    }
    for (const pts of segs) {
      if (pts.length < 2) continue;
      g.beginPath(); pts.forEach(([px, py], i) => (i ? g.lineTo(px, py) : g.moveTo(px, py)));
      g.strokeStyle = color; g.lineWidth = 2; g.lineJoin = "round"; g.stroke();
      g.lineTo(pts[pts.length - 1][0], padT + ph); g.lineTo(pts[0][0], padT + ph); g.closePath();
      g.globalAlpha = .1; g.fillStyle = color; g.fill(); g.globalAlpha = 1;
    }
  }
  function niceMax(v) {
    const p = Math.pow(10, Math.floor(Math.log10(v))), m = v / p;
    return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
  }

  // ---- connection ----
  function paintConn() {
    const c = $("conn"), ok = connState === true, bad = connState === false;
    c.classList.toggle("ok", ok); c.classList.toggle("bad", bad);
    $("conn-txt").textContent = tr(ok ? "live" : bad ? "offline" : "connecting");
    $("banner").classList.toggle("show", bad);
    $("main").classList.toggle("stale", bad && !!last);
    if (bad && err) {
      const why = err.kind === "timeout" ? tr("timeout") : err.kind === "json" ? tr("notJson") : err.kind === "net" ? tr("net") : err.msg;
      const ago = lastOk ? tr("agoOk", { d: dur((Date.now() - lastOk) / 1000) }) : "";
      $("banner").innerHTML = `<b>${esc(tr("unreach"))}</b> — ${esc(why + ago)}${esc(tr("retry"))}${last ? esc(tr("staleNote")) : ""}${esc(tr("end"))}`;
    }
    $("f-last").textContent = lastOk
      ? tr("lastUpd", { t: new Date(lastOk).toLocaleTimeString(L, { hour12: false }) }) : "—";
  }

  async function poll() {
    if (inflight) return;
    inflight = true;
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 3000);
    try {
      // days=1 (today's bucket) every second; the full history (400 days) at start and every minute
      const full = Date.now() - daysAt > 60000;
      const r = await fetch("/status?days=" + (full ? 400 : 1), { cache: "no-store", signal: ctl.signal });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      if (!d || typeof d !== "object") { const e = new Error(); e.kind = "json"; throw e; }
      const t = Date.now();
      last = d; lastOk = t; connState = true; err = null;
      const dd = d.lifetime?.days;
      if (dd && typeof dd === "object") { if (full) { DAYS = {}; daysAt = t; } Object.assign(DAYS, dd); }
      else if (!d.lifetime) DAYS = {};
      paintConn();
      render(d, t);
    } catch (e) {
      connState = false;
      err = e.name === "AbortError" ? { kind: "timeout" } : e.kind ? { kind: e.kind } : e.name === "SyntaxError" ? { kind: "json" } : e.name === "TypeError" ? { kind: "net" } : { kind: "msg", msg: e.message || String(e) };
      paintConn();
      // Leave a gap in the chart: push a null sample
      samples.push({ t: Date.now(), out: null, in: null, cached: null, prod: null, mono: null, tps: null });
      while (samples.length && Date.now() - samples[0].t > HIST_S * 1000 + 2000) samples.shift();
      prevRows = [];
      drawChart();
    } finally {
      clearTimeout(to); inflight = false;
    }
  }

  // ---- language, prices, details ----
  function applyLang() {
    S = I18N[L]; setFormats();
    document.documentElement.lang = L;
    document.title = tr("title");
    for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = tr(el.dataset.i18n);
    for (const el of document.querySelectorAll("[data-i18n-title]")) el.title = tr(el.dataset.i18nTitle);
    const box = $("lang");
    box.setAttribute("aria-label", tr("_lang"));
    box.innerHTML = LOCALES.map((k) =>
      `<button type="button" lang="${k}" data-l="${k}" class="${k === L ? "on" : ""}" aria-pressed="${k === L}">${esc(I18N[k]._name)}</button>`).join("");
    paintConn();
    paintPrices();
    paint();
  }
  function paintPrices(keepInputs) {
    if (!keepInputs) for (const k in DEF_PRICE) $("p-" + k).value = PRICE[k];
    const def = isDefPrice();
    $("p-src").textContent = tr(def ? "pDef" : "pCustom");
    $("p-reset").disabled = def;
  }
  for (const k in DEF_PRICE) $("p-" + k).addEventListener("input", (e) => {
    const v = e.target.valueAsNumber;
    if (!isFinite(v) || v < 0) return; // keep the last valid price while typing
    PRICE[k] = v;
    store("qw-prices", JSON.stringify(PRICE));
    paintPrices(true); paint();
  });
  $("p-reset").addEventListener("click", () => {
    PRICE = { ...DEF_PRICE };
    store("qw-prices", null);
    paintPrices(); paint();
  });
  $("scope").addEventListener("click", (e) => {
    const s = e.target.closest("button")?.dataset.s;
    if (!s || s === scope) return;
    scope = s; store("qw-scope", s);
    paint();
  });
  $("lang").addEventListener("click", (e) => {
    const k = e.target.closest("button")?.dataset.l;
    if (!k || k === L || !I18N[k]) return;
    L = k; store("qw-lang", k); // storage blocked: the choice lasts for this tab only
    applyLang();
  });
  const det = $("det");
  det.open = load("qw-details") === "1";
  det.addEventListener("toggle", () => { store("qw-details", det.open ? "1" : null); paintHist(); });

  window.addEventListener("resize", () => { drawChart(); drawHist(); });
  matchMedia("(prefers-color-scheme: light)").addEventListener?.("change", () => { drawChart(); drawHist(); });
  applyLang();
  poll();
  setInterval(poll, POLL_MS);
})();
</script>
</body>
</html>
