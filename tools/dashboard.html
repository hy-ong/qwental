<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwental</title>
<style>
:root {
  --bg: #0e1116; --panel: #161b22; --panel2: #1c222b; --line: #2a313c;
  --fg: #e6edf3; --dim: #8b949e; --faint: #5c6570;
  --accent: #58a6ff; --ok: #3fb950; --warn: #d29922; --bad: #f85149; --violet: #bc8cff;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f8fa; --panel: #ffffff; --panel2: #f0f3f6; --line: #d8dee4;
    --fg: #1f2328; --dim: #59636e; --faint: #8c959f;
    --accent: #0969da; --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e; --violet: #8250df;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); }
.wrap { max-width: 1400px; margin: 0 auto; padding: 16px 20px 32px; min-width: 760px; }
.num, td, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
header h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: .2px; }
header .meta { display: flex; gap: 14px; color: var(--dim); font-size: 13px; flex-wrap: wrap; }
header .meta b { color: var(--fg); font-weight: 500; font-family: var(--mono); }
.conn { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
.conn.ok .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.conn.bad { border-color: var(--bad); color: var(--bad); }
.conn.bad .dot { background: var(--bad); }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; font-size: 12px; }
.lang button { font: inherit; color: var(--dim); background: var(--panel); border: 0; padding: 4px 10px; cursor: pointer; }
.lang button + button { border-left: 1px solid var(--line); }
.lang button.on { color: var(--fg); background: var(--panel2); font-weight: 600; }
.banner { display: none; margin-bottom: 16px; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--panel)); color: var(--fg); }
.banner.show { display: block; }
.banner b { color: var(--bad); }
.stale { opacity: .45; transition: opacity .3s; }
.grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.card .lbl { color: var(--dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .big { font-family: var(--mono); font-size: 30px; font-weight: 600; line-height: 1.15; margin-top: 4px; white-space: nowrap; }
.card .big small { font-size: 15px; color: var(--dim); font-weight: 400; }
.card .sub { color: var(--dim); font-size: 12px; margin-top: 4px; font-family: var(--mono); text-wrap: balance; overflow-wrap: anywhere; }
.card .hint { color: var(--dim); font-size: 12px; margin-top: 4px; text-wrap: balance; }
.bar { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin-top: 8px; position: relative; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s; }
.bar.over > span { background: var(--bad); }
.over-txt { color: var(--bad) !important; }
#k-mem-sub, #k-sys { white-space: normal; }
#k-sys { font-family: var(--sans); }
.pf { display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; vertical-align: middle; font-size: 12px; color: var(--dim); }
.pf .bar { width: 64px; height: 3px; margin: 0; }
.pf .bar > span { background: var(--warn); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-family: var(--sans); border: 1px solid currentColor; line-height: 1.5; }
.m-spec { color: var(--violet); } .m-batch { color: var(--accent); } .m-idle { color: var(--faint); }
.s-prefill { color: var(--warn); } .s-solo { color: var(--violet); } .s-batch { color: var(--accent); } .s-other { color: var(--dim); }
.row2 { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-bottom: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.panel h2 { font-size: 13.5px; margin: 0 0 8px; font-weight: 600; display: flex; align-items: baseline; gap: 10px; }
.panel h2 .note { color: var(--dim); font-weight: 400; font-size: 12px; }
.panel h2 > span:first-child { white-space: nowrap; flex-shrink: 0; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--dim); margin-left: auto; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; background: var(--c); }
.chartp { display: flex; flex-direction: column; }
.cbox { position: relative; flex: 1; min-height: 170px; }
.cbox canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: right; color: var(--dim); font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; font-family: var(--sans); }
td { text-align: right; padding: 5px 8px; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); white-space: nowrap; }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
tbody tr:hover { background: var(--panel2); }
td.cache { width: 26%; }
.cbar { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.cbar .bar { flex: 1; margin: 0; max-width: 220px; }
.cbar .bar > span { background: var(--ok); }
.cbar .pct { width: 4.2em; text-align: right; }
.empty { color: var(--dim); text-align: center; padding: 18px; font-family: var(--sans); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--dim); }
.kv dd { margin: 0; text-align: right; font-family: var(--mono); }
.rates { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.rates .r { display: grid; grid-template-columns: max-content 1fr 4.5em; align-items: center; gap: 8px; font-size: 12px; margin: 3px 0; }
.rates .r .bar { margin: 0; }
.rates .r .v { text-align: right; font-family: var(--mono); }
.rates .r.cur .k { color: var(--fg); font-weight: 600; }
.rates .r .k { color: var(--dim); font-family: var(--mono); white-space: nowrap; min-width: 6.5em; }
.seg { display: inline-flex; margin-left: auto; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; font-size: 12px; font-weight: 400; }
.seg[hidden] { display: none; }
.seg button { font: inherit; color: var(--dim); background: var(--panel); border: 0; padding: 2px 10px; cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { color: var(--fg); background: var(--panel2); font-weight: 600; }
#cost, #hist { margin-bottom: 16px; }
#hist .cbox { min-height: 150px; margin-bottom: 8px; }
#hist td.cur, #hist tr.cur td { font-weight: 650; }
#hist tr.cur td:first-child { box-shadow: inset 3px 0 var(--accent); }
#hist td:first-child { padding-left: 10px; font-family: var(--sans); }
.costg { display: grid; grid-template-columns: 1fr 1fr minmax(250px, .85fr); gap: 0; }
.costg > div { padding: 2px 16px; min-width: 0; }
.costg > div:first-child { padding-left: 0; }
.costg > div + div { border-left: 1px solid var(--line); }
.cs .lbl, .cp .lbl { color: var(--dim); font-size: 12.5px; }
.cs .big { font-family: var(--mono); font-size: 28px; font-weight: 600; line-height: 1.2; margin: 2px 0 6px; white-space: nowrap; }
.ck { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 12px; font-size: 13px; margin: 0; }
.ck dt { color: var(--dim); }
.ck dd { margin: 0; text-align: right; font-family: var(--mono); }
.ck dd.t { color: var(--faint); }
.cs .sub { color: var(--dim); font-size: 12px; margin-top: 6px; }
.cs .empty { text-align: left; padding: 8px 0; font-size: 12.5px; }
.cp label { display: grid; grid-template-columns: 1fr 7.5em; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); margin: 5px 0; }
.cp input { font: 13px var(--mono); color: var(--fg); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; text-align: right; width: 100%; }
.cp input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); border-color: var(--accent); }
.cp-foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--dim); }
.cp-foot button { margin-left: auto; font: inherit; color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; cursor: pointer; white-space: nowrap; }
.cp-foot button:disabled { color: var(--faint); cursor: default; }
footer { color: var(--faint); font-size: 12px; margin-top: 14px; display: flex; gap: 16px; flex-wrap: wrap; }
@media (max-width: 1180px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 980px) { .row2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Qwental</h1>
    <div class="meta">
      <span><span data-i18n="ver"></span> <b id="h-ver">—</b></span>
      <span><span data-i18n="prof"></span> <b id="h-prof">—</b></span>
      <span><span data-i18n="up"></span> <b id="h-up">—</b></span>
    </div>
    <div class="conn" id="conn"><span class="dot"></span><span id="conn-txt"></span></div>
    <div class="lang" id="lang" role="group"></div>
  </header>

  <div class="banner" id="banner"></div>

  <div id="main">
  <section class="grid">
    <div class="card">
      <div class="lbl" data-i18n="act" data-i18n-title="actT"></div>
      <div class="big"><span id="k-act">—</span><small> / <span id="k-par">—</span></small></div>
      <div class="bar"><span id="k-act-bar" style="width:0"></span></div>
    </div>
    <div class="card">
      <div class="lbl" data-i18n="queued" data-i18n-title="queuedT"></div>
      <div class="big" id="k-q">—</div>
      <div class="hint" id="k-q-hint"></div>
    </div>
    <div class="card">
      <div class="lbl" data-i18n="mode" data-i18n-title="modeT"></div>
      <div class="big" style="font-size:22px;margin-top:8px"><span class="pill m-idle" id="k-mode">—</span></div>
      <div class="hint" id="k-mode-hint">—</div>
    </div>
    <div class="card">
      <div class="lbl" data-i18n="tps" data-i18n-title="tpsT"></div>
      <div class="big" id="k-tps">—</div>
      <div class="sub" id="k-tps-sub"></div>
    </div>
    <div class="card">
      <div class="lbl" data-i18n="hit" data-i18n-title="hitT"></div>
      <div class="big" id="k-hit">—</div>
      <div class="sub" id="k-hit-sub">—</div>
    </div>
    <div class="card" id="c-mem">
      <div class="lbl" data-i18n="mem" data-i18n-title="memT"></div>
      <div class="big"><span id="k-mem">—</span><small> GB</small></div>
      <div class="bar" id="k-mem-barw"><span id="k-mem-bar" style="width:0"></span></div>
      <div class="sub" id="k-mem-sub">—</div>
      <div class="sub" id="k-sys" data-i18n-title="sysT" hidden></div>
    </div>
  </section>

  <section class="row2">
    <div class="panel chartp">
      <h2><span data-i18n="chart"></span> <span class="note" data-i18n="chartNote"></span>
        <span class="legend"><span style="--c:var(--accent)" data-i18n="lgTps"></span><span style="--c:var(--violet)" data-i18n="lgAct"></span></span></h2>
      <div class="cbox"><canvas id="chart"></canvas></div>
    </div>
    <div class="panel">
      <h2><span data-i18n="totals"></span> <span class="note" id="totals-note"></span>
        <span class="seg" id="scope" role="group" hidden><button type="button" data-s="s" data-i18n="scopeS"></button><button type="button" data-s="l" data-i18n="scopeL" data-i18n-title="scopeLT"></button></span></h2>
      <dl class="kv">
        <dt data-i18n-title="tTotalT"><b data-i18n="tTotal"></b> <span class="note" data-i18n="tTotalNote"></span></dt><dd id="t-total"><b>—</b></dd>
        <dt data-i18n-title="tGpuT"><b data-i18n="tGpu"></b> <span class="note" data-i18n="tGpuNote"></span></dt><dd id="t-gpu"><b>—</b></dd>
        <dt data-i18n="tDone"></dt><dd id="t-done">—</dd>
        <dt data-i18n="tIn"></dt><dd id="t-in">—</dd>
        <dt data-i18n="tCached" data-i18n-title="tCachedT"></dt><dd id="t-cached">—</dd>
        <dt data-i18n="tPf" data-i18n-title="tPfT"></dt><dd id="t-pf">—</dd>
        <dt data-i18n="tOut"></dt><dd id="t-out">—</dd>
        <dt data-i18n="tAvg"></dt><dd id="t-avg">—</dd>
      </dl>
      <div class="rates" id="rates" hidden>
        <div class="lbl" style="color:var(--dim);font-size:12px;margin-bottom:4px" data-i18n="rates" data-i18n-title="ratesT"></div>
        <div id="rates-list"></div>
      </div>
    </div>
  </section>

  <section class="panel" id="cost">
    <h2><span data-i18n="cost" data-i18n-title="costT"></span> <span class="note" data-i18n="costNote"></span></h2>
    <div class="costg">
      <div class="cs" id="cs-s"></div>
      <div class="cs" id="cs-l"></div>
      <div class="cp">
        <div class="lbl" data-i18n="prices"></div>
        <label><span data-i18n="pIn" data-i18n-title="pInT"></span><input id="p-in" type="number" min="0" step="any" inputmode="decimal"></label>
        <label><span data-i18n="pCache"></span><input id="p-cache" type="number" min="0" step="any" inputmode="decimal"></label>
        <label><span data-i18n="pOut"></span><input id="p-out" type="number" min="0" step="any" inputmode="decimal"></label>
        <div class="cp-foot"><span id="p-src"></span><button type="button" id="p-reset" data-i18n="pReset"></button></div>
      </div>
    </div>
  </section>

  <section class="panel" id="hist" hidden>
    <h2><span data-i18n="hist"></span> <span class="note" id="hist-note"></span>
      <span class="seg" id="per" role="group"><button type="button" data-p="d" data-i18n="pD"></button><button type="button" data-p="w" data-i18n="pW"></button><button type="button" data-p="m" data-i18n="pM"></button></span></h2>
    <div class="cbox"><canvas id="hchart"></canvas></div>
    <table>
      <thead><tr><th class="l" data-i18n="hPer"></th><th data-i18n="tDone"></th><th data-i18n="tIn"></th><th data-i18n="tCached"></th><th data-i18n="tOut"></th><th data-i18n="cost"></th></tr></thead>
      <tbody id="hbody"></tbody>
    </table>
  </section>

  <section class="panel">
    <h2><span data-i18n="tbl"></span> <span class="note" id="tbl-note"></span></h2>
    <table>
      <thead><tr>
        <th class="l">#</th><th class="l" data-i18n="thState"></th><th data-i18n="thPrompt"></th><th data-i18n="thCached"></th><th class="cache" data-i18n="thHit" data-i18n-title="thHitT"></th><th data-i18n="thNeed" data-i18n-title="thNeedT"></th><th data-i18n="thGen"></th><th data-i18n="thTps" data-i18n-title="thTpsT"></th>
      </tr></thead>
      <tbody id="tbody"><tr><td colspan="8" class="empty" data-i18n="waiting"></td></tr></tbody>
    </table>
  </section>
  </div>

  <footer>
    <span><span data-i18n="srcA"></span><span class="mono">GET /status</span><span data-i18n="srcB"></span></span>
    <span id="f-last">—</span>
    <span data-i18n="foot"></span>
  </footer>
</div>

<script>
"use strict";
(() => {
  const $ = (id) => document.getElementById(id);
  const POLL_MS = 1000, HIST_S = 300, TPS_WIN = 5, HIT_WIN = 60;
  const num = (v) => (typeof v === "number" && isFinite(v) ? v : null);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

      cNoLife: "All-time totals appear when the server keeps stats.json (--cache-dir or --stats-file).",
      prices: "Price per 1M tokens (USD)", pIn: "Input", pInT: "Prompt tokens not served from cache", pCache: "Cache read", pOut: "Output",
      pReset: "Reset to defaults", pDef: "Default prices", pCustom: "Custom prices, saved in this browser",
      hist: "Usage by period", histNote: "Local time; weeks start on Monday", pD: "Day", pW: "Week", pM: "Month", hPer: "Period",
      wkOf: "Week of {d}", cur: { d: "today", w: "this week", m: "this month" },
    },

      const ca = costOf({ prompt_tokens: cw.a.in, cached_tokens: cw.a.cached, output_tokens: cw.a.out });
      const cb = costOf({ prompt_tokens: cw.b.in, cached_tokens: cw.b.cached, output_tokens: cw.b.out });
      if (ca && cb) recent = tr("cRecent", { n: NF0.format(Math.round(cw.dt / 60)), v: money(Math.max(0, cb.total - ca.total) / cw.dt * 3600) });
    }
    $("cs-s").innerHTML = costCol(tr("scopeS"), "", d, num(d.uptime_s), recent);
    $("cs-l").innerHTML = life ? costCol(tr("scopeL"), lifeNote, life, num(life.uptime_s), null)
      : `<div class="lbl">${esc(tr("scopeL"))}</div><div class="empty">${esc(tr("cNoLife"))}</div>`;

    // Measured rates: the server sends "rate"; "rates" is accepted too
    const rt = d.rate && typeof d.rate === "object" ? d.rate : d.rates && typeof d.rates === "object" ? d.rates : null;
    if (rt) {
      const ents = Object.entries(rt).filter(([, v]) => num(v) !== null && v > 0);
      ents.sort((a, b) => (a[0] === "spec" ? -1 : b[0] === "spec" ? 1 : (parseInt(a[0].slice(5)) || 0) - (parseInt(b[0].slice(5)) || 0)));
      const mx = Math.max(1, ...ents.map(([, v]) => v));
      const curKey = mode === "spec" ? "spec" : mode === "batch" ? "batch" + (matched.filter((r) => r.state === "batch").length || nAct) : "";
      $("rates").hidden = !ents.length;
      $("rates-list").innerHTML = ents.map(([k, v]) =>
        `<div class="r${k === curKey ? " cur" : ""}"><span class="k">${esc(k === "spec" ? "spec ×1" : k.replace(/^(batch|slice)/, "$1 ×"))}</span>` +
        `<div class="bar"><span style="width:${(v / mx) * 100}%;background:${k === "spec" ? "var(--violet)" : "var(--accent)"}"></span></div>` +
        `<span class="v">${fmtTps(v)}</span></div>`).join("");
    } else $("rates").hidden = true;

    const tb = $("tbody");
    if (!active) {
      tb.innerHTML = `<tr><td colspan="8" class="empty">${esc(tr(par === 1 ? "par1" : "noActive"))}</td></tr>`;
    } else if (!matched.length) {
      tb.innerHTML = `<tr><td colspan="8" class="empty">${esc(tr("none"))}</td></tr>`;
    } else {
      tb.innerHTML = matched.map((r, i) => {
        const st = S.st[r.state] || [r.state, ""];
        const h = r.prompt ? r.cached / r.prompt : 0;
        const rt2 = r.stps ?? r.tps;
        return `<tr><td class="l" style="color:var(--faint)">${hasId ? esc(r.id) : i + 1}</td>` +
          `<td class="l"><span class="pill ${STATE_CLS[r.state] || "s-other"}"${st[1] ? ` title="${esc(st[1])}"` : ""}>${esc(st[0])}</span>` +
          (r.state === "prefill" && r.pf !== null && r.prompt ? `<span class="pf" title="${esc(tr("pfT"))}"><span class="bar"><span style="width:${Math.min(100, (r.pf / r.prompt) * 100).toFixed(1)}%"></span></span>${human(r.pf)} / ${human(r.prompt)}</span>` : "") + `</td>` +
          `<td>${human(r.prompt)}</td><td>${human(r.cached)}</td>` +
          `<td class="cache"><div class="cbar"><div class="bar"><span style="width:${(h * 100).toFixed(1)}%"></span></div><span class="pct">${pct(h)}</span></div></td>` +
          `<td>${human(Math.max(0, r.prompt - r.cached))}</td>` +
          `<td>${human(r.gen)}</td>` +
          `<td>${r.state === "prefill" ? '<span style="color:var(--faint)">—</span>' : fmtTps(rt2 === null || rt2 === undefined ? null : Math.max(0, rt2))}</td></tr>`;
      }).join("");
    }
    $("tbl-note").textContent = active && matched.length
      ? tr("count", { n: NF0.format(matched.length) }) + (hasId ? "" : tr("noId")) : "";

    paintHist();
    drawChart();
  }

  // ---- usage by period (from lifetime.days, summed in the page) ----
  let DAYS = {}, daysAt = 0, per = "d", hrows = [];
  try { if (/^[dwm]$/.test(localStorage.getItem("qw-per"))) per = localStorage.getItem("qw-per"); } catch (e) { /* ignore */ }
  const p2 = (n) => String(n).padStart(2, "0");
  const dkey = (x) => `${x.getFullYear()}-${p2(x.getMonth() + 1)}-${p2(x.getDate())}`;
  function periods() {
    const n = new Date(), y = n.getFullYear(), m = n.getMonth(), dd = n.getDate(), out = [];
    const df = (o) => new Intl.DateTimeFormat(L, o);
    if (per === "d") {
      const f = df({ weekday: "short", month: "short", day: "numeric" }), fs = df({ month: "numeric", day: "numeric" });
      for (let i = 13; i >= 0; i--) { const a = new Date(y, m, dd - i); out.push([a, new Date(y, m, dd - i + 1), f.format(a), fs.format(a)]); }
    } else if (per === "w") {
      const mon = dd - ((n.getDay() + 6) % 7), f = df({ month: "short", day: "numeric" }), fs = df({ month: "numeric", day: "numeric" });
      for (let i = 11; i >= 0; i--) { const a = new Date(y, m, mon - 7 * i); out.push([a, new Date(y, m, mon - 7 * i + 7), tr("wkOf", { d: f.format(a) }), fs.format(a)]); }
    } else {
      const f = df({ year: "numeric", month: "long" }), fs = df({ month: "short" });
      for (let i = 11; i >= 0; i--) { const a = new Date(y, m - i, 1); out.push([a, new Date(y, m - i + 1, 1), f.format(a), fs.format(a)]); }
    }
    return out.map(([a, b, label, short]) => {
      const ka = dkey(a), kb = dkey(b), r = { label, short, done: 0, prompt_tokens: 0, cached_tokens: 0, output_tokens: 0 };
      for (const [k, v] of Object.entries(DAYS)) if (k >= ka && k < kb && v) for (const f of ["done", "prompt_tokens", "cached_tokens", "output_tokens"]) r[f] += num(v[f]) ?? 0;
      r.cost = costOf(r).total;
      return r;
    });
  }
  function paintHist() {
    const on = !!view?.d?.lifetime;
    $("hist").hidden = !on;
    if (!on) return;
    for (const b of $("per").children) { const o = b.dataset.p === per; b.classList.toggle("on", o); b.setAttribute("aria-pressed", o); }
    $("hist-note").textContent = tr("histNote");
    hrows = periods();
    const cur = hrows.length - 1;
    $("hbody").innerHTML = hrows.map((r, i) => i).reverse().map((i) => {
      const r = hrows[i];
      return `<tr${i === cur ? ' class="cur"' : ""}><td class="l">${esc(r.label)}${i === cur ? ` <span class="pill s-batch">${esc(S.cur[per])}</span>` : ""}</td>` +
        `<td>${human(r.done)}</td><td>${human(r.prompt_tokens)}</td><td>${human(r.cached_tokens)}</td><td>${human(r.output_tokens)}</td><td>${money(r.cost)}</td></tr>`;
    }).join("");
    drawHist();
  }
  function drawHist() {
    const cv = $("hchart");
    if ($("hist").hidden || !cv.clientWidth) return;
    const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
    const g = cv.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const padL = 74, padR = 8, padT = 6, padB = 18, pw = W - padL - padR, ph = H - padT - padB, n = hrows.length;
    const mx = niceMax(Math.max(0.01, ...hrows.map((r) => r.cost)));
    g.font = `11px ${cssVar("--mono")}`; g.fillStyle = cssVar("--faint"); g.strokeStyle = cssVar("--line"); g.lineWidth = 1;
    for (let k = 0; k <= 4; k++) {
      const y = padT + ph * (1 - k / 4);
      g.beginPath(); g.moveTo(padL, y + .5); g.lineTo(padL + pw, y + .5); g.stroke();
      const v = (mx * k) / 4; g.textAlign = "right"; g.fillText(v >= 1 || !v ? USD[0].format(v) : money(v), padL - 6, y + 4);
    }
    const bw = pw / n, acc = cssVar("--accent");
    g.font = `11px ${cssVar("--sans")}`; g.textAlign = "center";
    hrows.forEach((r, i) => {
      const h = (r.cost / mx) * ph, x0 = padL + i * bw + bw * 0.18;
      g.fillStyle = acc; g.globalAlpha = i === n - 1 ? 1 : 0.45;
      g.fillRect(x0, padT + ph - h, bw * 0.64, h);
      g.globalAlpha = 1; g.fillStyle = cssVar(i === n - 1 ? "--fg" : "--faint");
      g.fillText(r.short, padL + (i + 0.5) * bw, H - 4);
    });
  }
  $("per").addEventListener("click", (e) => {
    const k = e.target.closest("button")?.dataset.p;
    if (!k || k === per) return;
    per = k;
    try { localStorage.setItem("qw-per", k); } catch (er) { /* storage blocked */ }
    paintHist();
  });

  // ---- chart ----
  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function drawChart() {
    const cv = $("chart"), dpr = window.devicePixelRatio || 1;
    const W = cv.clientWidth, H = cv.clientHeight;
    if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
    const g = cv.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    const padL = 40, padR = 30, padT = 8, padB = 18, pw = W - padL - padR, ph = H - padT - padB;
    const now = samples.length ? samples[samples.length - 1].t : Date.now();
    const x = (t) => padL + pw * (1 - (now - t) / (HIST_S * 1000));
    const tv = samples.map((s) => s.tps).filter((v) => v !== null);
    const av = samples.map((s) => s.act).filter((v) => v !== null);
    const tmax = niceMax(Math.max(10, ...tv));
    const amax = Math.max(1, num(last?.parallel) ?? 1, ...av);
    const line = cssVar("--line"), dim = cssVar("--faint");
    g.font = `11px ${cssVar("--mono")}`; g.fillStyle = dim; g.strokeStyle = line; g.lineWidth = 1;
    for (let k = 0; k <= 5; k++) {
      const y = padT + ph * (1 - k / 5);
      g.beginPath(); g.moveTo(padL, y + .5); g.lineTo(padL + pw, y + .5); g.stroke();
      g.textAlign = "right"; g.fillText(NF2.format(+((tmax * k) / 5).toPrecision(3)), padL - 6, y + 4);
    }
    g.textAlign = "left";
    for (const f of [0, 0.5, 1]) {
      const v = amax * f;
      if (f === 0.5 && v % 1) continue;
      g.fillText(NF0.format(v), padL + pw + 6, padT + ph * (1 - f) + 4);
    }
    g.font = `11px ${cssVar("--sans")}`;
    g.textAlign = "center";
    for (const m of [5, 4, 3, 2, 1, 0]) g.fillText(m ? tr("axMin", { m }) : tr("axNow"), padL + pw * (1 - m / 5), H - 4);

    const series = (key, mx, color, fill) => {
      // null samples (while disconnected) split the line into segments
      const segs = [[]];
      for (const s of samples) {
        if (s[key] === null) { if (segs[segs.length - 1].length) segs.push([]); continue; }
        segs[segs.length - 1].push([x(s.t), padT + ph * (1 - Math.min(1, s[key] / mx))]);
      }
      for (const pts of segs) {
        if (pts.length < 2) continue;
        g.beginPath(); pts.forEach(([px, py], i) => (i ? g.lineTo(px, py) : g.moveTo(px, py)));
        g.strokeStyle = color; g.lineWidth = 1.8; g.lineJoin = "round"; g.stroke();
        if (fill) {
          g.lineTo(pts[pts.length - 1][0], padT + ph); g.lineTo(pts[0][0], padT + ph); g.closePath();
          g.globalAlpha = .14; g.fillStyle = color; g.fill(); g.globalAlpha = 1;
        }
      }
    };
    series("act", amax, cssVar("--violet"), false);
    series("tps", tmax, cssVar("--accent"), true);
  }
  function niceMax(v) {
    const p = Math.pow(10, Math.floor(Math.log10(v))), m = v / p;
    return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
  }

  // ---- connection ----
  function paintConn() {
    const c = $("conn"), ok = connState === true, bad = connState === false;
    c.classList.toggle("ok", ok); c.classList.toggle("bad", bad);
    $("conn-txt").textContent = tr(ok ? "live" : bad ? "offline" : "connecting");
    $("banner").classList.toggle("show", bad);
    $("main").classList.toggle("stale", bad && !!last);
    if (bad && err) {
      const why = err.kind === "timeout" ? tr("timeout") : err.kind === "json" ? tr("notJson") : err.kind === "net" ? tr("net") : err.msg;
      const ago = lastOk ? tr("agoOk", { d: dur((Date.now() - lastOk) / 1000) }) : "";
      $("banner").innerHTML = `<b>${esc(tr("unreach"))}</b> — ${esc(why + ago)}${esc(tr("retry"))}${last ? esc(tr("staleNote")) : ""}${esc(tr("end"))}`;
    }
    $("f-last").textContent = lastOk
      ? tr("lastUpd", { t: new Date(lastOk).toLocaleTimeString(L, { hour12: false }) }) : "—";
  }

  async function poll() {
    if (inflight) return;
    inflight = true;
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 3000);
    try {
      // days=1 (today's bucket) every second; the full history (400 days) at start and every minute
      const full = Date.now() - daysAt > 60000;
      const r = await fetch("/status?days=" + (full ? 400 : 1), { cache: "no-store", signal: ctl.signal });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      if (!d || typeof d !== "object") { const e = new Error(); e.kind = "json"; throw e; }
      const t = Date.now();
      last = d; lastOk = t; connState = true; err = null;
      const dd = d.lifetime?.days;
      if (dd && typeof dd === "object") { if (full) { DAYS = {}; daysAt = t; } Object.assign(DAYS, dd); }
      else if (!d.lifetime) DAYS = {};
      paintConn();
      render(d, t);
    } catch (e) {
      connState = false;
      err = e.name === "AbortError" ? { kind: "timeout" } : e.kind ? { kind: e.kind } : e.name === "SyntaxError" ? { kind: "json" } : e.name === "TypeError" ? { kind: "net" } : { kind: "msg", msg: e.message || String(e) };
      paintConn();
      // Leave a gap in the chart: push a null sample
      samples.push({ t: Date.now(), out: null, in: null, cached: null, act: null, prod: null, mono: null, tps: null });
      while (samples.length && Date.now() - samples[0].t > HIST_S * 1000 + 2000) samples.shift();
      prevRows = [];
      drawChart();
    } finally {
      clearTimeout(to); inflight = false;
    }
  }

  // ---- language ----
  function applyLang() {
    S = I18N[L]; setFormats();
    document.documentElement.lang = L;
    document.title = tr("title");
    for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = tr(el.dataset.i18n);
    for (const el of document.querySelectorAll("[data-i18n-title]")) el.title = tr(el.dataset.i18nTitle);
    const box = $("lang");
    box.setAttribute("aria-label", tr("_lang"));
    box.innerHTML = LOCALES.map((k) =>
      `<button type="button" lang="${k}" data-l="${k}" class="${k === L ? "on" : ""}" aria-pressed="${k === L}">${esc(I18N[k]._name)}</button>`).join("");
    paintConn();
    paintPrices();
    paint();
  }
  function paintPrices(keepInputs) {
    if (!keepInputs) for (const k in DEF_PRICE) $("p-" + k).value = PRICE[k];
    const def = isDefPrice();
    $("p-src").textContent = tr(def ? "pDef" : "pCustom");
    $("p-reset").disabled = def;
  }
  for (const k in DEF_PRICE) $("p-" + k).addEventListener("input", (e) => {
    const v = e.target.valueAsNumber;
    if (!isFinite(v) || v < 0) return; // keep the last valid price while typing
    PRICE[k] = v;
    try { localStorage.setItem("qw-prices", JSON.stringify(PRICE)); } catch (er) { /* storage blocked */ }
    paintPrices(true); paint();
  });
  $("p-reset").addEventListener("click", () => {
    PRICE = { ...DEF_PRICE };
    try { localStorage.removeItem("qw-prices"); } catch (er) { /* storage blocked */ }
    paintPrices(); paint();
  });
  $("scope").addEventListener("click", (e) => {
    const s = e.target.closest("button")?.dataset.s;
    if (!s || s === scope) return;
    scope = s;
    try { localStorage.setItem("qw-scope", s); } catch (er) { /* storage blocked */ }
    paint();
  });
  $("lang").addEventListener("click", (e) => {
    const k = e.target.closest("button")?.dataset.l;
    if (!k || k === L || !I18N[k]) return;
    L = k;
    try { localStorage.setItem("qw-lang", k); } catch (er) { /* storage blocked: choice lasts for this tab only */ }
    applyLang();
  });

  window.addEventListener("resize", () => { drawChart(); drawHist(); });
  matchMedia("(prefers-color-scheme: light)").addEventListener?.("change", drawChart);
  applyLang();
  poll();
  setInterval(poll, POLL_MS);
})();
</script>
</body>
</html>
