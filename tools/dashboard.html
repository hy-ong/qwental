<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwental</title>
<style>
:root {
  --bg: #0e1116; --panel: #161b22; --panel2: #1c222b; --line: #2a313c;
  --fg: #e6edf3; --dim: #8b949e; --faint: #5c6570;
  --accent: #58a6ff; --ok: #3fb950; --warn: #d29922; --bad: #f85149; --violet: #bc8cff;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f8fa; --panel: #ffffff; --panel2: #f0f3f6; --line: #d8dee4;
    --fg: #1f2328; --dim: #59636e; --faint: #8c959f;
    --accent: #0969da; --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e; --violet: #8250df;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); }
.wrap { max-width: 1400px; margin: 0 auto; padding: 16px 20px 32px; min-width: 760px; }
.num, td, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
header h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: .2px; }
header .meta { display: flex; gap: 14px; color: var(--dim); font-size: 13px; flex-wrap: wrap; }
header .meta b { color: var(--fg); font-weight: 500; font-family: var(--mono); }
.conn { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
.conn.ok .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.conn.bad { border-color: var(--bad); color: var(--bad); }
.conn.bad .dot { background: var(--bad); }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; font-size: 12px; }
.lang button { font: inherit; color: var(--dim); background: var(--panel); border: 0; padding: 4px 10px; cursor: pointer; }
.lang button + button { border-left: 1px solid var(--line); }
.lang button.on { color: var(--fg); background: var(--panel2); font-weight: 600; }
.banner { display: none; margin-bottom: 16px; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--panel)); color: var(--fg); }
.banner.show { display: block; }
.banner b { color: var(--bad); }
.stale { opacity: .45; transition: opacity .3s; }
.grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.card .lbl { color: var(--dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .big { font-family: var(--mono); font-size: 30px; font-weight: 600; line-height: 1.15; margin-top: 4px; white-space: nowrap; }
.card .big small { font-size: 15px; color: var(--dim); font-weight: 400; }
.card .sub { color: var(--dim); font-size: 12px; margin-top: 4px; font-family: var(--mono); text-wrap: balance; overflow-wrap: anywhere; }
.card .hint { color: var(--dim); font-size: 12px; margin-top: 4px; text-wrap: balance; }
.bar { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin-top: 8px; position: relative; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s; }
.bar.over > span { background: var(--bad); }
.over-txt { color: var(--bad) !important; }
#k-mem-sub { white-space: normal; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-family: var(--sans); border: 1px solid currentColor; line-height: 1.5; }
.m-spec { color: var(--violet); } .m-batch { color: var(--accent); } .m-idle { color: var(--faint); }
.s-prefill { color: var(--warn); } .s-solo { color: var(--violet); } .s-batch { color: var(--accent); } .s-other { color: var(--dim); }
.row2 { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-bottom: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.panel h2 { font-size: 13.5px; margin: 0 0 8px; font-weight: 600; display: flex; align-items: baseline; gap: 10px; }
.panel h2 .note { color: var(--dim); font-weight: 400; font-size: 12px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--dim); margin-left: auto; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; background: var(--c); }
.chartp { display: flex; flex-direction: column; }
.cbox { position: relative; flex: 1; min-height: 170px; }
.cbox canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: right; color: var(--dim); font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; font-family: var(--sans); }
td { text-align: right; padding: 5px 8px; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); white-space: nowrap; }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
tbody tr:hover { background: var(--panel2); }
td.cache { width: 26%; }
.cbar { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.cbar .bar { flex: 1; margin: 0; max-width: 220px; }
.cbar .bar > span { background: var(--ok); }
.cbar .pct { width: 4.2em; text-align: right; }
.empty { color: var(--dim); text-align: center; padding: 18px; font-family: var(--sans); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--dim); }
.kv dd { margin: 0; text-align: right; font-family: var(--mono); }
.rates { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.rates .r { display: grid; grid-template-columns: max-content 1fr 4.5em; align-items: center; gap: 8px; font-size: 12px; margin: 3px 0; }
.rates .r .bar { margin: 0; }
.rates .r .v { text-align: right; font-family: var(--mono); }
.rates .r.cur .k { color: var(--fg); font-weight: 600; }
.rates .r .k { color: var(--dim); font-family: var(--mono); white-space: nowrap; min-width: 6.5em; }
footer { color: var(--faint); font-size: 12px; margin-top: 14px; display: flex; gap: 16px; flex-wrap: wrap; }
@media (max-width: 1180px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 980px) { .row2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Qwental</h1>
    <div class="meta">
      <span><span data-i18n="ver"></span> <b id="h-ver">—</b></span>
      <span><span data-i18n="prof"></span> <b id="h-prof">—</b></span>
      <span><span data-i18n="up"></span> <b id="h-up">—</b></span>
    </div>
    <div class="conn" id="conn"><span class="dot"></span><span id="conn-txt"></span></div>
    <div class="lang" id="lang" role="group"></div>
  </header>

  <div class="banner" id="banner"></div>

  <div id="main">
  <section class="grid">
    <div class="card">
      <div class="lbl" data-i18n="act" data-i18n-title="actT"></div>
      <div class="big"><span id="k-act">—</span><small> / <span id="k-par">—</span></small></div>
      <div class="bar"><span id="k-act-bar" style="width:0"></span></div>
    </div>
    <div class="card">
      <div class="lbl" data-i18n="queued" data-i18n-title="queuedT"></div>
      <div class="big" id="k-q">—</div>
      <div class="hint" id="k-q-hint"></div>
    </div>
    <div class="card">
      <div class="lbl" data-i18n="mode" data-i18n-title="modeT"></div>
      <div class="big" style="font-size:22px;margin-top:8px"><span class="pill m-idle" id="k-mode">—</span></div>
      <div class="hint" id="k-mode-hint">—</div>
    </div>
    <div class="card">
      <div class="lbl" data-i18n="tps" data-i18n-title="tpsT"></div>
      <div class="big" id="k-tps">—</div>
      <div class="sub" id="k-tps-sub"></div>
    </div>
    <div class="card">
      <div class="lbl" data-i18n="hit" data-i18n-title="hitT"></div>
      <div class="big" id="k-hit">—</div>
      <div class="sub" id="k-hit-sub">—</div>
    </div>
    <div class="card" id="c-mem">
      <div class="lbl" data-i18n="mem" data-i18n-title="memT"></div>
      <div class="big"><span id="k-mem">—</span><small> GB</small></div>
      <div class="bar" id="k-mem-barw"><span id="k-mem-bar" style="width:0"></span></div>
      <div class="sub" id="k-mem-sub">—</div>
    </div>
  </section>

  <section class="row2">
    <div class="panel chartp">
      <h2><span data-i18n="chart"></span> <span class="note" data-i18n="chartNote"></span>
        <span class="legend"><span style="--c:var(--accent)" data-i18n="lgTps"></span><span style="--c:var(--violet)" data-i18n="lgAct"></span></span></h2>
      <div class="cbox"><canvas id="chart"></canvas></div>
    </div>
    <div class="panel">
      <h2><span data-i18n="totals"></span> <span class="note" data-i18n="totalsNote"></span></h2>
      <dl class="kv">
        <dt data-i18n-title="tTotalT"><b data-i18n="tTotal"></b> <span class="note" data-i18n="tTotalNote"></span></dt><dd id="t-total"><b>—</b></dd>
        <dt data-i18n-title="tGpuT"><b data-i18n="tGpu"></b> <span class="note" data-i18n="tGpuNote"></span></dt><dd id="t-gpu"><b>—</b></dd>
        <dt data-i18n="tDone"></dt><dd id="t-done">—</dd>
        <dt data-i18n="tIn"></dt><dd id="t-in">—</dd>
        <dt data-i18n="tCached" data-i18n-title="tCachedT"></dt><dd id="t-cached">—</dd>
        <dt data-i18n="tPf" data-i18n-title="tPfT"></dt><dd id="t-pf">—</dd>
        <dt data-i18n="tOut"></dt><dd id="t-out">—</dd>
        <dt data-i18n="tAvg"></dt><dd id="t-avg">—</dd>
      </dl>
      <div class="rates" id="rates" hidden>
        <div class="lbl" style="color:var(--dim);font-size:12px;margin-bottom:4px" data-i18n="rates" data-i18n-title="ratesT"></div>
        <div id="rates-list"></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2><span data-i18n="tbl"></span> <span class="note" id="tbl-note"></span></h2>
    <table>
      <thead><tr>
        <th class="l">#</th><th class="l" data-i18n="thState"></th><th data-i18n="thPrompt"></th><th data-i18n="thCached"></th><th class="cache" data-i18n="thHit" data-i18n-title="thHitT"></th><th data-i18n="thNeed" data-i18n-title="thNeedT"></th><th data-i18n="thGen"></th><th data-i18n="thTps" data-i18n-title="thTpsT"></th>
      </tr></thead>
      <tbody id="tbody"><tr><td colspan="8" class="empty" data-i18n="waiting"></td></tr></tbody>
    </table>
  </section>
  </div>

  <footer>
    <span><span data-i18n="srcA"></span><span class="mono">GET /status</span><span data-i18n="srcB"></span></span>
    <span id="f-last">—</span>
    <span data-i18n="foot"></span>
  </footer>
</div>

<script>
"use strict";
(() => {
  const $ = (id) => document.getElementById(id);
  const POLL_MS = 1000, HIST_S = 300, TPS_WIN = 5, HIT_WIN = 60;
  const num = (v) => (typeof v === "number" && isFinite(v) ? v : null);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  // ---- strings: every user-visible text lives here, one complete table per locale ----
  const I18N = {
    en: {
      _name: "EN", _lang: "Language", title: "Qwental Dashboard",
      ver: "Version", prof: "Profile", up: "Uptime",
      connecting: "Connecting…", live: "Live", offline: "Offline",
      unreach: "Server unreachable", retry: ". Retrying every second", staleNote: "; showing the last data received below", end: ".",
      timeout: "timed out", net: "network error", notJson: "response is not a JSON object", agoOk: ", last success {d} ago",
      act: "Active / parallel", actT: "Conversations being served now / maximum concurrent conversations (--parallel)",
      queued: "Queued", queuedT: "Requests waiting because every slot is busy",
      qWait: "At the conversation limit; waiting for a free slot", qNone: "No requests waiting",
      mode: "Decode mode", modeT: "How the server is decoding right now; it picks whichever measured rate is higher",
      tps: "Output tok/s", tpsT: "Output tokens per second across all conversations",
      tpsSub: "Last {n} s", perConv: " · ≈ {v} per conversation",
      hit: "Cache hit rate", hitT: "Share of prompt tokens reused from the prefix cache since server start",
      hitRecent: "Last {n} s: {p}", hitNone: "No requests completed recently",
      mem: "Slot memory used / budget", memT: "KV-cache memory held by conversation slots, against the slot budget",
      budget: "Budget {b} GB · {p}", budgetNone: "Budget —", over: " · over budget, idle slots will be released",
      chart: "Last 5 minutes", chartNote: "Sampled every second, kept only in this tab",
      lgTps: "Output tok/s", lgAct: "Active conversations", axNow: "now", axMin: "-{m}m",
      totals: "Totals", totalsNote: "Since server start",
      tTotal: "Total", tTotalNote: "prompt + output", tTotalT: "All prompt tokens plus all output tokens",
      tGpu: "GPU computed", tGpuNote: "prefill + output", tGpuT: "Tokens the GPU actually computed: prompt tokens not served from cache, plus output",
      tDone: "Requests completed", tIn: "Prompt tokens", tCached: "Reused from cache", tCachedT: "Prompt tokens served from the prefix cache",
      tPf: "Actual prefill", tPfT: "Prompt tokens minus cached tokens", tOut: "Output tokens", tAvg: "Avg output / request", tok: "tok",
      rates: "Measured rates (EMA, used to pick the mode)", ratesT: "spec ×1 = speculative decoding of one conversation; batch ×N = N conversations decoded together; slice ×N = N conversations taking turns",
      tbl: "Active conversations",
      thState: "State", thPrompt: "Prompt", thCached: "Cached", thHit: "Hit", thHitT: "Share of this prompt served from cache",
      thNeed: "To prefill", thNeedT: "prompt − cached: tokens that must still be computed", thGen: "Generated", thTps: "tok/s", thTpsT: "Output speed of this conversation",
      waiting: "Waiting for data…", par1: "parallel = 1: the server does not report individual conversations",
      noActive: "The server did not report the active field", none: "No active conversations",
      count: "{n} active", noId: " · no stable id; tok/s inferred by matching prompt + cached",
      st: { prefill: ["prefill", "Reading the prompt (prefill)"], solo: ["solo", "Decoding on its own with speculative decoding"], batch: ["batch", "Decoding together with other conversations"] },
      md: { spec: ["spec", "Speculative decoding; each conversation runs on its own"], batch: ["batch", "Conversations decode together for higher total throughput"],
            idle: ["idle", "No active conversations"], single: ["single", "Single-conversation mode (parallel = 1)"] },
      srcA: "Data from ", srcB: ", polled every second", lastUpd: "Last update {t}",
      foot: "spec = each conversation decodes speculatively on its own; batch = several conversations decode together",
      du: { d: "d", h: "h", m: "m", s: "s" },
    },
    "zh-TW": {
      _name: "中文", _lang: "語言", title: "Qwental 儀表板",
      ver: "版本", prof: "格式", up: "已執行",
      connecting: "連線中…", live: "已連線", offline: "離線",
      unreach: "連不到伺服器", retry: "。每秒自動重試", staleNote: "；下方是最後一次成功取得的資料", end: "。",
      timeout: "逾時", net: "網路錯誤", notJson: "回應不是 JSON 物件", agoOk: "，上次成功是 {d}前",
      act: "進行中對話 / 上限", actT: "目前正在處理的對話數 / 最多可同時處理的對話數（--parallel）",
      queued: "排隊中", queuedT: "所有 slot 都在忙，正在等待的請求",
      qWait: "對話數已達上限，等待空出的 slot", qNone: "沒有等待中的請求",
      mode: "解碼模式", modeT: "伺服器目前的解碼方式；會依實測速度選比較快的那種",
      tps: "輸出速度 tok/s", tpsT: "所有對話合計每秒輸出的 token 數",
      tpsSub: "近 {n} 秒", perConv: " · 每對話 ≈ {v}",
      hit: "快取命中率", hitT: "伺服器啟動以來，prompt token 從前綴快取重用的比例",
      hitRecent: "近 {n} 秒 {p}", hitNone: "近期尚無完成請求",
      mem: "Slot 記憶體 用量 / 預算", memT: "各對話 slot 佔用的 KV cache 記憶體，對照 slot 預算",
      budget: "預算 {b} GB · {p}", budgetNone: "預算 —", over: " · 超過預算，會釋放閒置 slot",
      chart: "近 5 分鐘", chartNote: "每秒取樣，只存在這個分頁",
      lgTps: "輸出 tok/s", lgAct: "進行中對話", axNow: "現在", axMin: "-{m} 分",
      totals: "累計", totalsNote: "伺服器啟動以來",
      tTotal: "總計", tTotalNote: "prompt + 輸出", tTotalT: "全部 prompt token 加上全部輸出 token",
      tGpu: "GPU 實算", tGpuNote: "prefill + 輸出", tGpuT: "GPU 實際算過的 token：沒命中快取的 prompt token，加上輸出",
      tDone: "完成請求", tIn: "Prompt token", tCached: "快取重用", tCachedT: "從前綴快取直接取用的 prompt token",
      tPf: "實際 prefill", tPfT: "prompt token 扣掉快取重用的部分", tOut: "輸出 token", tAvg: "平均輸出 / 請求", tok: "tok",
      rates: "實測速度（EMA，用來選模式）", ratesT: "spec ×1 = 單一對話推測解碼；batch ×N = N 個對話一起解碼；slice ×N = N 個對話輪流推測解碼",
      tbl: "進行中對話",
      thState: "狀態", thPrompt: "Prompt", thCached: "快取", thHit: "命中", thHitT: "這個 prompt 從快取取用的比例",
      thNeed: "需 prefill", thNeedT: "prompt − 快取：還要實際計算的 token", thGen: "已生成", thTps: "tok/s", thTpsT: "這個對話的輸出速度",
      waiting: "等待資料…", par1: "parallel = 1：伺服器不回報個別對話",
      noActive: "伺服器沒有回報 active 欄位", none: "目前沒有進行中的對話",
      count: "{n} 個", noId: " · 無穩定 id，tok/s 以 prompt + 快取配對推算",
      st: { prefill: ["讀入中", "正在讀入 prompt（prefill）"], solo: ["單獨推測", "單獨以推測解碼生成"], batch: ["一起解碼", "和其他對話一起解碼（batch）"] },
      md: { spec: ["spec", "推測解碼：每個對話各自跑"], batch: ["batch", "多個對話一起解碼，總吞吐較高"],
            idle: ["閒置", "沒有進行中的對話"], single: ["單一", "單一對話模式（parallel = 1）"] },
      srcA: "資料來源 ", srcB: "，每秒輪詢", lastUpd: "最後更新 {t}",
      foot: "spec = 每個對話各自推測解碼；batch = 多個對話一起解碼",
      du: { d: " 天", h: " 小時", m: " 分", s: " 秒" },
    },
  };
  const LOCALES = Object.keys(I18N);
  function pickLang() {
    const norm = (l) => (/^zh\b/i.test(l || "") ? "zh-TW" : /^en\b/i.test(l || "") ? "en" : null);
    let q = null;
    try { q = norm(new URLSearchParams(location.search).get("lang")); } catch (e) { /* ignore */ }
    if (q) return q;
    try { const s = localStorage.getItem("qw-lang"); if (I18N[s]) return s; } catch (e) { /* storage blocked */ }
    const navs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
    return navs.some((l) => norm(l) === "zh-TW") ? "zh-TW" : "en";
  }
  let L = pickLang(), S = I18N[L], NF0, NF1, NF2, PCT;
  const tr = (k, v) => String(S[k] ?? k).replace(/\{(\w+)\}/g, (_, n) => (v && v[n] !== undefined ? v[n] : ""));
  function setFormats() {
    NF0 = new Intl.NumberFormat(L, { maximumFractionDigits: 0 });
    NF1 = new Intl.NumberFormat(L, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    NF2 = new Intl.NumberFormat(L, { maximumFractionDigits: 2 });
    PCT = new Intl.NumberFormat(L, { style: "percent", minimumFractionDigits: 1, maximumFractionDigits: 1 });
  }

  function human(n, d) {
    n = num(n); if (n === null) return "—";
    const a = Math.abs(n);
    if (a >= 1e9) return (n / 1e9).toFixed(d ?? 2) + "B";
    if (a >= 1e6) return (n / 1e6).toFixed(d ?? 2) + "M";
    if (a >= 1e4) return (n / 1e3).toFixed(d ?? 1) + "K";
    return NF0.format(Math.round(n));
  }
  const pct = (x) => (x === null || !isFinite(x) ? "—" : PCT.format(x));
  function dur(s) {
    s = num(s); if (s === null) return "—";
    s = Math.floor(s);
    const u = S.du, d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    const f = (...p) => p.map(([v, k]) => v + u[k]).join(" ");
    if (d) return f([d, "d"], [h, "h"], [m, "m"]);
    if (h) return f([h, "h"], [m, "m"]);
    if (m) return f([m, "m"], [x, "s"]);
    return f([x, "s"]);
  }
  const fmtTps = (v) => (v === null ? "—" : v >= 100 ? NF0.format(v) : NF1.format(v));

  const STATE_ALIAS = { p: "prefill", s: "solo", b: "batch" };
  const STATE_CLS = { prefill: "s-prefill", solo: "s-solo", batch: "s-batch" };
  const MODE_CLS = { spec: "m-spec", batch: "m-batch", idle: "m-idle", single: "m-idle" };

  // ---- state ----
  let samples = [];     // {t, out, in, cached, act, tps}
  let prevRows = [];    // [{prompt, cached, gen, t, tps}]
  let last = null, lastOk = 0, inflight = false, connState = null, err = null;
  let view = null;      // last rendered snapshot, repainted on language switch

  // No stable job id: pair rows across polls by (prompt, cached) and require generated not to go backwards
  function matchRows(rows, t) {
    const pool = prevRows.slice();
    return rows.map((r) => {
      let best = -1;
      for (let i = 0; i < pool.length; i++) {
        const p = pool[i];
        if (p && p.prompt === r.prompt && p.cached === r.cached && r.gen >= p.gen) {
          if (best < 0 || Math.abs(p.gen - r.gen) < Math.abs(pool[best].gen - r.gen)) best = i;
        }
      }
      let tps = null, since = t, gen0 = r.gen;
      if (best >= 0) {
        const p = pool[best]; pool[best] = null;
        since = p.since; gen0 = p.gen0;
        const dt = (t - p.t) / 1000;
        if (dt > 0) {
          const inst = (r.gen - p.gen) / dt;
          tps = p.tps === null ? inst : p.tps * 0.5 + inst * 0.5;
        }
      }
      return { ...r, t, tps, since, gen0 };
    });
  }

  function windowed(win) {
    const n = samples.length; if (n < 2) return null;
    const lastS = samples[n - 1];
    let i = n - 1;
    while (i > 0 && lastS.t - samples[i - 1].t <= win * 1000 + 300) i--;
    const a = samples[i]; if (a === lastS) return null;
    return { a, b: lastS, dt: (lastS.t - a.t) / 1000 };
  }

  // Ingest one /status response: update history and per-row rates, then paint
  function render(d, t) {
    const out = num(d.output_tokens), pin = num(d.prompt_tokens), cch = num(d.cached_tokens);
    const active = Array.isArray(d.active) ? d.active : null;
    const nAct = active ? active.length : null;

    // Counters went down (server restart): drop the history
    const prevS = samples[samples.length - 1];
    if (prevS && out !== null && prevS.out !== null && out < prevS.out) { samples = []; prevRows = []; }
    samples.push({ t, out, in: pin, cached: cch, act: nAct, tps: null });
    while (samples.length && t - samples[0].t > HIST_S * 1000 + 2000) samples.shift();

    let tps = null;
    const w = windowed(TPS_WIN);
    if (w && w.a.out !== null && w.b.out !== null && w.dt > 0) tps = Math.max(0, (w.b.out - w.a.out) / w.dt);

    const rows = (active || []).map((a) => ({
      prompt: num(a?.prompt) ?? 0, cached: num(a?.cached) ?? 0, gen: num(a?.generated) ?? 0,
      state: typeof a?.state === "string" ? (STATE_ALIAS[a.state] || a.state) : "?", id: a?.id,
      stps: num(a?.tps),
    }));
    const hasId = rows.some((r) => r.id !== undefined && r.id !== null);
    let matched;
    if (hasId) {
      const byId = new Map(prevRows.map((p) => [String(p.id), p]));
      matched = rows.map((r) => {
        const p = byId.get(String(r.id));
        let tpsR = null;
        if (p) { const dt = (t - p.t) / 1000; if (dt > 0) { const inst = (r.gen - p.gen) / dt; tpsR = p.tps === null ? inst : p.tps * 0.5 + inst * 0.5; } }
        return { ...r, t, tps: tpsR };
      });
    } else matched = matchRows(rows, t);
    prevRows = matched;

    // Fallback when the output counter is missing: sum the per-row rates
    if (tps === null && matched.length && samples.length > 1) {
      const s = matched.reduce((acc, r) => acc + (r.stps ?? r.tps ?? 0), 0);
      if (s > 0) tps = s;
    }
    samples[samples.length - 1].tps = tps;
    view = { d, tps, matched, hasId, hw: windowed(HIT_WIN) };
    paint();
  }

  // Draw the current snapshot in the current language (no state changes)
  function paint() {
    if (!view) { drawChart(); return; }
    const { d, tps, matched, hasId, hw } = view;
    const out = num(d.output_tokens), pin = num(d.prompt_tokens), cch = num(d.cached_tokens);
    const active = Array.isArray(d.active) ? d.active : null;
    const par = num(d.parallel);
    const nAct = active ? active.length : null;

    $("h-ver").textContent = d.version ?? "—";
    $("h-prof").textContent = d.profile ?? "—";
    $("h-up").textContent = dur(d.uptime_s);

    $("k-act").textContent = nAct === null ? "—" : NF0.format(nAct);
    $("k-par").textContent = par === null ? "—" : NF0.format(par);
    $("k-act-bar").style.width = nAct !== null && par ? Math.min(100, (nAct / par) * 100) + "%" : "0";
    const q = num(d.queued);
    $("k-q").textContent = q === null ? "—" : NF0.format(q);
    $("k-q").style.color = q ? "var(--warn)" : "";
    $("k-q-hint").textContent = tr(q ? "qWait" : "qNone");

    const mode = typeof d.mode === "string" ? d.mode : (par === 1 ? "single" : null);
    const mi = S.md[mode] || [mode ?? "—", "—"];
    const mEl = $("k-mode"); mEl.textContent = mi[0]; mEl.className = "pill " + (MODE_CLS[mode] || "m-idle");
    $("k-mode-hint").textContent = mi[1];

    $("k-tps").textContent = fmtTps(tps);
    const perConv = tps !== null && nAct ? tps / nAct : null;
    $("k-tps-sub").textContent = tr("tpsSub", { n: NF0.format(TPS_WIN) }) + (perConv !== null ? tr("perConv", { v: fmtTps(perConv) }) : "");

    const hit = pin ? (cch ?? 0) / pin : null;
    $("k-hit").textContent = pct(hit);
    let rhit = null;
    if (hw && hw.a.in !== null && hw.b.in !== null) {
      const rin = hw.b.in - hw.a.in;
      if (rin > 0) rhit = ((hw.b.cached ?? 0) - (hw.a.cached ?? 0)) / rin;
    }
    $("k-hit-sub").textContent = rhit !== null ? tr("hitRecent", { n: NF0.format(Math.round(hw.dt)), p: pct(rhit) }) : tr("hitNone");

    const mem = num(d.slot_mem_gb), bud = num(d.slot_budget_gb);
    $("k-mem").textContent = mem === null ? "—" : NF1.format(mem);
    const over = mem !== null && bud !== null && mem > bud;
    $("k-mem-barw").classList.toggle("over", over);
    $("k-mem").classList.toggle("over-txt", over);
    $("k-mem-bar").style.width = mem !== null && bud ? Math.min(100, (mem / bud) * 100) + "%" : "0";
    $("k-mem-sub").textContent = bud === null ? tr("budgetNone") :
      tr("budget", { b: NF1.format(bud), p: pct(mem / bud) }) + (over ? tr("over") : "");
    $("k-mem-sub").classList.toggle("over-txt", over);

    $("t-total").innerHTML = pin !== null && out !== null ? "<b>" + human(pin + out) + "</b>" : "—";
    $("t-gpu").innerHTML = pin !== null && cch !== null && out !== null ? "<b>" + human(pin - cch + out) + "</b>" : "—";
    $("t-done").textContent = human(d.done);
    $("t-in").textContent = human(pin);
    $("t-cached").textContent = human(cch) + (hit !== null ? `  (${pct(hit)})` : "");
    $("t-pf").textContent = pin !== null && cch !== null ? human(pin - cch) : "—";
    $("t-out").textContent = human(out);
    const dn = num(d.done);
    $("t-avg").textContent = dn && out !== null ? human(out / dn) + " " + tr("tok") : "—";

    // Measured rates: the server sends "rate"; "rates" is accepted too
    const rt = d.rate && typeof d.rate === "object" ? d.rate : d.rates && typeof d.rates === "object" ? d.rates : null;
    if (rt) {
      const ents = Object.entries(rt).filter(([, v]) => num(v) !== null && v > 0);
      ents.sort((a, b) => (a[0] === "spec" ? -1 : b[0] === "spec" ? 1 : (parseInt(a[0].slice(5)) || 0) - (parseInt(b[0].slice(5)) || 0)));
      const mx = Math.max(1, ...ents.map(([, v]) => v));
      const curKey = mode === "spec" ? "spec" : mode === "batch" ? "batch" + (matched.filter((r) => r.state === "batch").length || nAct) : "";
      $("rates").hidden = !ents.length;
      $("rates-list").innerHTML = ents.map(([k, v]) =>
        `<div class="r${k === curKey ? " cur" : ""}"><span class="k">${esc(k === "spec" ? "spec ×1" : k.replace(/^(batch|slice)/, "$1 ×"))}</span>` +
        `<div class="bar"><span style="width:${(v / mx) * 100}%;background:${k === "spec" ? "var(--violet)" : "var(--accent)"}"></span></div>` +
        `<span class="v">${fmtTps(v)}</span></div>`).join("");
    } else $("rates").hidden = true;

    const tb = $("tbody");
    if (!active) {
      tb.innerHTML = `<tr><td colspan="8" class="empty">${esc(tr(par === 1 ? "par1" : "noActive"))}</td></tr>`;
    } else if (!matched.length) {
      tb.innerHTML = `<tr><td colspan="8" class="empty">${esc(tr("none"))}</td></tr>`;
    } else {
      tb.innerHTML = matched.map((r, i) => {
        const st = S.st[r.state] || [r.state, ""];
        const h = r.prompt ? r.cached / r.prompt : 0;
        const rt2 = r.stps ?? r.tps;
        return `<tr><td class="l" style="color:var(--faint)">${hasId ? esc(r.id) : i + 1}</td>` +
          `<td class="l"><span class="pill ${STATE_CLS[r.state] || "s-other"}"${st[1] ? ` title="${esc(st[1])}"` : ""}>${esc(st[0])}</span></td>` +
          `<td>${human(r.prompt)}</td><td>${human(r.cached)}</td>` +
          `<td class="cache"><div class="cbar"><div class="bar"><span style="width:${(h * 100).toFixed(1)}%"></span></div><span class="pct">${pct(h)}</span></div></td>` +
          `<td>${human(Math.max(0, r.prompt - r.cached))}</td>` +
          `<td>${human(r.gen)}</td>` +
          `<td>${r.state === "prefill" ? '<span style="color:var(--faint)">—</span>' : fmtTps(rt2 === null || rt2 === undefined ? null : Math.max(0, rt2))}</td></tr>`;
      }).join("");
    }
    $("tbl-note").textContent = active && matched.length
      ? tr("count", { n: NF0.format(matched.length) }) + (hasId ? "" : tr("noId")) : "";

    drawChart();
  }

  // ---- chart ----
  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function drawChart() {
    const cv = $("chart"), dpr = window.devicePixelRatio || 1;
    const W = cv.clientWidth, H = cv.clientHeight;
    if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
    const g = cv.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    const padL = 40, padR = 30, padT = 8, padB = 18, pw = W - padL - padR, ph = H - padT - padB;
    const now = samples.length ? samples[samples.length - 1].t : Date.now();
    const x = (t) => padL + pw * (1 - (now - t) / (HIST_S * 1000));
    const tv = samples.map((s) => s.tps).filter((v) => v !== null);
    const av = samples.map((s) => s.act).filter((v) => v !== null);
    const tmax = niceMax(Math.max(10, ...tv));
    const amax = Math.max(1, num(last?.parallel) ?? 1, ...av);
    const line = cssVar("--line"), dim = cssVar("--faint");
    g.font = `11px ${cssVar("--mono")}`; g.fillStyle = dim; g.strokeStyle = line; g.lineWidth = 1;
    for (let k = 0; k <= 5; k++) {
      const y = padT + ph * (1 - k / 5);
      g.beginPath(); g.moveTo(padL, y + .5); g.lineTo(padL + pw, y + .5); g.stroke();
      g.textAlign = "right"; g.fillText(NF2.format(+((tmax * k) / 5).toPrecision(3)), padL - 6, y + 4);
    }
    g.textAlign = "left";
    for (const f of [0, 0.5, 1]) {
      const v = amax * f;
      if (f === 0.5 && v % 1) continue;
      g.fillText(NF0.format(v), padL + pw + 6, padT + ph * (1 - f) + 4);
    }
    g.font = `11px ${cssVar("--sans")}`;
    g.textAlign = "center";
    for (const m of [5, 4, 3, 2, 1, 0]) g.fillText(m ? tr("axMin", { m }) : tr("axNow"), padL + pw * (1 - m / 5), H - 4);

    const series = (key, mx, color, fill) => {
      // null samples (while disconnected) split the line into segments
      const segs = [[]];
      for (const s of samples) {
        if (s[key] === null) { if (segs[segs.length - 1].length) segs.push([]); continue; }
        segs[segs.length - 1].push([x(s.t), padT + ph * (1 - Math.min(1, s[key] / mx))]);
      }
      for (const pts of segs) {
        if (pts.length < 2) continue;
        g.beginPath(); pts.forEach(([px, py], i) => (i ? g.lineTo(px, py) : g.moveTo(px, py)));
        g.strokeStyle = color; g.lineWidth = 1.8; g.lineJoin = "round"; g.stroke();
        if (fill) {
          g.lineTo(pts[pts.length - 1][0], padT + ph); g.lineTo(pts[0][0], padT + ph); g.closePath();
          g.globalAlpha = .14; g.fillStyle = color; g.fill(); g.globalAlpha = 1;
        }
      }
    };
    series("act", amax, cssVar("--violet"), false);
    series("tps", tmax, cssVar("--accent"), true);
  }
  function niceMax(v) {
    const p = Math.pow(10, Math.floor(Math.log10(v))), m = v / p;
    return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
  }

  // ---- connection ----
  function paintConn() {
    const c = $("conn"), ok = connState === true, bad = connState === false;
    c.classList.toggle("ok", ok); c.classList.toggle("bad", bad);
    $("conn-txt").textContent = tr(ok ? "live" : bad ? "offline" : "connecting");
    $("banner").classList.toggle("show", bad);
    $("main").classList.toggle("stale", bad && !!last);
    if (bad && err) {
      const why = err.kind === "timeout" ? tr("timeout") : err.kind === "json" ? tr("notJson") : err.kind === "net" ? tr("net") : err.msg;
      const ago = lastOk ? tr("agoOk", { d: dur((Date.now() - lastOk) / 1000) }) : "";
      $("banner").innerHTML = `<b>${esc(tr("unreach"))}</b> — ${esc(why + ago)}${esc(tr("retry"))}${last ? esc(tr("staleNote")) : ""}${esc(tr("end"))}`;
    }
    $("f-last").textContent = lastOk
      ? tr("lastUpd", { t: new Date(lastOk).toLocaleTimeString(L, { hour12: false }) }) : "—";
  }

  async function poll() {
    if (inflight) return;
    inflight = true;
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 3000);
    try {
      const r = await fetch("/status", { cache: "no-store", signal: ctl.signal });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      if (!d || typeof d !== "object") { const e = new Error(); e.kind = "json"; throw e; }
      const t = Date.now();
      last = d; lastOk = t; connState = true; err = null;
      paintConn();
      render(d, t);
    } catch (e) {
      connState = false;
      err = e.name === "AbortError" ? { kind: "timeout" } : e.kind ? { kind: e.kind } : e.name === "SyntaxError" ? { kind: "json" } : e.name === "TypeError" ? { kind: "net" } : { kind: "msg", msg: e.message || String(e) };
      paintConn();
      // Leave a gap in the chart: push a null sample
      samples.push({ t: Date.now(), out: null, in: null, cached: null, act: null, tps: null });
      while (samples.length && Date.now() - samples[0].t > HIST_S * 1000 + 2000) samples.shift();
      prevRows = [];
      drawChart();
    } finally {
      clearTimeout(to); inflight = false;
    }
  }

  // ---- language ----
  function applyLang() {
    S = I18N[L]; setFormats();
    document.documentElement.lang = L;
    document.title = tr("title");
    for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = tr(el.dataset.i18n);
    for (const el of document.querySelectorAll("[data-i18n-title]")) el.title = tr(el.dataset.i18nTitle);
    const box = $("lang");
    box.setAttribute("aria-label", tr("_lang"));
    box.innerHTML = LOCALES.map((k) =>
      `<button type="button" lang="${k}" data-l="${k}" class="${k === L ? "on" : ""}" aria-pressed="${k === L}">${esc(I18N[k]._name)}</button>`).join("");
    paintConn();
    paint();
  }
  $("lang").addEventListener("click", (e) => {
    const k = e.target.closest("button")?.dataset.l;
    if (!k || k === L || !I18N[k]) return;
    L = k;
    try { localStorage.setItem("qw-lang", k); } catch (er) { /* storage blocked: choice lasts for this tab only */ }
    applyLang();
  });

  window.addEventListener("resize", drawChart);
  matchMedia("(prefers-color-scheme: light)").addEventListener?.("change", drawChart);
  applyLang();
  poll();
  setInterval(poll, POLL_MS);
})();
</script>
</body>
</html>
